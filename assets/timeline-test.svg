<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Test timeline">
  <rect width="1600" height="700" fill="#FFFFFF"/>

  <!-- Track -->
  <g transform="translate(80 360)">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#0B2545" stroke-width="4"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#F5A623" stroke-width="2" stroke-dasharray="6 8"/>

    <!-- Milestones -->
    <g font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0B2545" text-anchor="middle">
      <!-- M0 Design freeze -->
      <g transform="translate(80 0)">
        <circle r="14" fill="#F5A623"/>
        <circle r="22" fill="none" stroke="#F5A623" stroke-width="1"/>
        <line y1="40" y2="120" stroke="#F5A623" stroke-width="1"/>
        <text y="-40" font-size="20">M0</text>
        <text y="-18" opacity="0.7" letter-spacing="2">DESIGN FREEZE</text>
        <text y="80" font-size="12" opacity="0.7">总体方案冻结</text>
        <text y="100" font-size="11" opacity="0.5">PDR · CDR</text>
      </g>
      <!-- M3 Component tests -->
      <g transform="translate(320 0)">
        <circle r="14" fill="#0B2545"/>
        <line y1="-40" y2="-120" stroke="#0B2545" stroke-width="1"/>
        <text y="-150" font-size="20">M3</text>
        <text y="-128" opacity="0.7" letter-spacing="2">COMPONENT</text>
        <text y="-108" font-size="12" opacity="0.7">阀门 · 传感器 · 气瓶</text>
      </g>
      <!-- M6 Subsystem tests -->
      <g transform="translate(560 0)">
        <circle r="14" fill="#0B2545"/>
        <line y1="40" y2="120" stroke="#0B2545" stroke-width="1"/>
        <text y="80" font-size="20">M6</text>
        <text y="102" opacity="0.7" letter-spacing="2">SUBSYSTEM</text>
        <text y="124" font-size="12" opacity="0.7">推进剂 · 时序 · 遥测</text>
      </g>
      <!-- M9 First hot fire -->
      <g transform="translate(800 0)">
        <circle r="18" fill="#F5A623"/>
        <circle r="28" fill="none" stroke="#F5A623" stroke-width="2"/>
        <line y1="-40" y2="-150" stroke="#F5A623" stroke-width="1"/>
        <text y="-180" font-size="24" fill="#F37820">M9</text>
        <text y="-158" opacity="0.8" letter-spacing="2" fill="#F37820">FIRST HOT FIRE</text>
        <text y="-138" font-size="13" fill="#F37820">首次热试车 · 30 s</text>
      </g>
      <!-- M10 Re-ignition -->
      <g transform="translate(1040 0)">
        <circle r="14" fill="#0B2545"/>
        <line y1="40" y2="120" stroke="#0B2545" stroke-width="1"/>
        <text y="80" font-size="20">M10</text>
        <text y="102" opacity="0.7" letter-spacing="2">RE-IGNITION</text>
        <text y="124" font-size="12" opacity="0.7">重复点火 · 节流</text>
      </g>
      <!-- M12 Long duration -->
      <g transform="translate(1280 0)">
        <circle r="18" fill="#F5A623"/>
        <circle r="28" fill="none" stroke="#F5A623" stroke-width="2"/>
        <line y1="-40" y2="-150" stroke="#F5A623" stroke-width="1"/>
        <text y="-180" font-size="24" fill="#F37820">M12</text>
        <text y="-158" opacity="0.8" letter-spacing="2" fill="#F37820">LONG BURN</text>
        <text y="-138" font-size="13" fill="#F37820">长程试验 · 100 s</text>
      </g>
    </g>
  </g>

  <!-- Side panel: digital twin -->
  <g transform="translate(80 60)">
    <text font-family="Inter,sans-serif" font-size="11" letter-spacing="6" fill="#F5A623" font-weight="700">DIGITAL TWIN LOOP</text>
    <text y="30" font-family="Inter,sans-serif" font-size="22" fill="#0B2545" font-weight="700">设计 · 制造 · 试验 · 数据 · 仿真 · 改进</text>
  </g>
</svg>
