<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mission 1: Blue Flame engine family">
  <rect width="1600" height="790" fill="#FFFFFF"/>

  <g font-family="Inter, sans-serif">
    <text x="120" y="100" font-size="11" letter-spacing="6" fill="#F5A623" font-weight="700">MISSION 01 · 蓝焰系列</text>
    <text x="120" y="160" font-size="34" font-weight="800" fill="#0B2545">一型发动机,</text>
    <text x="120" y="206" font-size="34" font-weight="800" fill="#F5A623">一个工程血脉</text>
  </g>

  <!-- Engine family cards -->
  <g transform="translate(120 290)" font-family="Inter, sans-serif">
    <!-- BLUE FLAME-1 -->
    <g>
      <rect x="0" y="0" width="260" height="380" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="0" y="0" width="260" height="6" fill="#5B9BD5"/>
      <text x="20" y="42" font-size="11" letter-spacing="3" fill="#F5A623" font-weight="700">BF-1</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#0B2545">蓝焰-1</text>
      <text x="20" y="104" font-size="11" fill="#475569">VERIFICATION · 验证机</text>
      <line x1="20" y1="124" x2="60" y2="124" stroke="#F5A623" stroke-width="2"/>

      <!-- Mini engine icon -->
      <g transform="translate(130 200)">
        <rect x="-30" y="-30" width="60" height="50" fill="#1E3A8A"/>
        <path d="M -36 20 L 36 20 L 60 70 L -60 70 Z" fill="#5B9BD5"/>
        <path d="M -50 70 L 50 70 L 50 90 L -50 90 Z" fill="#F5A623"/>
      </g>

      <g transform="translate(20 320)" font-size="12" fill="#0B2545">
        <text>· 150 kN · 10 MPa</text>
        <text y="20">· LOX / LCH4</text>
        <text y="40">· 重 80 kg · 复用 5 次</text>
      </g>
    </g>

    <!-- BLUE FLAME-2 -->
    <g transform="translate(286 0)">
      <rect x="0" y="0" width="260" height="380" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="0" y="0" width="260" height="6" fill="#3B82F6"/>
      <text x="20" y="42" font-size="11" letter-spacing="3" fill="#F5A623" font-weight="700">BF-2</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#0B2545">蓝焰-2</text>
      <text x="20" y="104" font-size="11" fill="#475569">ENGINEERING · 工程化</text>
      <line x1="20" y1="124" x2="60" y2="124" stroke="#F5A623" stroke-width="2"/>

      <g transform="translate(130 200)">
        <rect x="-40" y="-40" width="80" height="60" fill="#1E40AF"/>
        <path d="M -50 20 L 50 20 L 80 80 L -80 80 Z" fill="#3B82F6"/>
        <path d="M -66 80 L 66 80 L 66 110 L -66 110 Z" fill="#F5A623"/>
      </g>

      <g transform="translate(20 320)" font-size="12" fill="#0B2545">
        <text>· 1 — 3 MN · 12 MPa</text>
        <text y="20">· 多机集群</text>
        <text y="40">· 复用 20+ 次</text>
      </g>
    </g>

    <!-- BLUE FLAME-3 -->
    <g transform="translate(572 0)">
      <rect x="0" y="0" width="260" height="380" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="0" y="0" width="260" height="6" fill="#1E40AF"/>
      <text x="20" y="42" font-size="11" letter-spacing="3" fill="#F5A623" font-weight="700">BF-3</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#0B2545">蓝焰-3</text>
      <text x="20" y="104" font-size="11" fill="#475569">REUSABLE · 复用版</text>
      <line x1="20" y1="124" x2="60" y2="124" stroke="#F5A623" stroke-width="2"/>

      <g transform="translate(130 200)">
        <rect x="-50" y="-50" width="100" height="70" fill="#1E3A8A"/>
        <path d="M -62 20 L 62 20 L 100 90 L -100 90 Z" fill="#1E40AF"/>
        <path d="M -84 90 L 84 90 L 84 120 L -84 120 Z" fill="#F5A623"/>
      </g>

      <g transform="translate(20 320)" font-size="12" fill="#0B2545">
        <text>· 10 MN 级 · 25 MPa</text>
        <text y="20">· 完整再生冷却</text>
        <text y="40">· 复用 100+ 次目标</text>
      </g>
    </g>

    <!-- BLUE FLAME HEAVY -->
    <g transform="translate(858 0)">
      <rect x="0" y="0" width="260" height="380" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="0" y="0" width="260" height="6" fill="#F5A623"/>
      <text x="20" y="42" font-size="11" letter-spacing="3" fill="#F5A623" font-weight="700">BF-H</text>
      <text x="20" y="80" font-size="22" font-weight="800" fill="#0B2545">蓝焰 重型</text>
      <text x="20" y="104" font-size="11" fill="#475569">FULL SCALE · 全尺寸</text>
      <line x1="20" y1="124" x2="60" y2="124" stroke="#F5A623" stroke-width="2"/>

      <g transform="translate(130 210)">
        <rect x="-60" y="-60" width="120" height="80" fill="#06182E"/>
        <path d="M -76 20 L 76 20 L 124 100 L -124 100 Z" fill="#0B2545"/>
        <path d="M -106 100 L 106 100 L 106 140 L -106 140 Z" fill="#F37820"/>
        <!-- Flame -->
        <path d="M -70 140 L 70 140 L 50 180 L -50 180 Z" fill="#F5A623" opacity="0.6"/>
      </g>

      <g transform="translate(20 320)" font-size="12" fill="#0B2545">
        <text>· 10 MN × N 集群</text>
        <text y="20">· 完全复用 · 快速翻修</text>
        <text y="40">· 入轨 ≤ ¥1,000 / kg</text>
      </g>
    </g>

    <!-- Common technology -->
    <g transform="translate(1154 0)">
      <rect x="0" y="0" width="206" height="380" fill="#0B2545"/>
      <text x="20" y="42" font-size="11" letter-spacing="3" fill="#F5A623" font-weight="700">COMMON DNA</text>
      <text x="20" y="80" font-size="20" font-weight="800" fill="#FFFFFF">同一血脉</text>
      <line x1="20" y1="100" x2="60" y2="100" stroke="#F5A623" stroke-width="2"/>

      <g transform="translate(20 130)" font-size="12" fill="#F5F7FA">
        <text>· LOX / LCH4</text>
        <text y="24">· 燃气发生器循环</text>
        <text y="48">· 再生冷却推力室</text>
        <text y="72">· 同一涡轮泵架构</text>
        <text y="96">· 同一遥测 + 健康监测</text>
        <text y="120">· 同一试验规程</text>
        <text y="144">· 同一数据资产</text>
      </g>

      <g transform="translate(20 320)">
        <text font-size="10" letter-spacing="2" fill="#F5A623" font-weight="700">数据是真正的资产</text>
      </g>
    </g>
  </g>

  <!-- Bottom callout -->
  <g transform="translate(120 740)" font-family="Inter, sans-serif">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#F5A623" stroke-width="2"/>
    <text y="40" font-size="14" fill="#0B2545" font-weight="700">从 BF-1 到 BF-H,不是 4 个新项目,是 4 个版本号。</text>
    <text y="68" font-size="13" fill="#475569">每代产品都继承上一代的推力室、涡轮泵、阀门、试验规程和数据资产,边际成本递减,可靠性递增。</text>
  </g>
</svg>
