<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Team roles">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#bgT)"/>

  <g font-family="Inter, sans-serif">
    <!-- CEO -->
    <g transform="translate(280 280)">
      <circle cx="0" cy="0" r="60" fill="#0B2545"/>
      <circle cx="0" cy="-15" r="22" fill="#F5F7FA"/>
      <path d="M -36 30 Q 0 -10 36 30 L 36 60 L -36 60 Z" fill="#F5F7FA"/>
      <text x="0" y="100" text-anchor="middle" font-size="14" letter-spacing="3" fill="#F5A623" font-weight="700">CEO</text>
      <text x="0" y="125" text-anchor="middle" font-size="13" fill="#0B2545" font-weight="700">战略 · 融资 · 合作</text>
    </g>
    <!-- CTO -->
    <g transform="translate(800 200)">
      <circle cx="0" cy="0" r="70" fill="#1E3A8A"/>
      <circle cx="0" cy="-18" r="26" fill="#F5F7FA"/>
      <path d="M -42 35 Q 0 -10 42 35 L 42 70 L -42 70 Z" fill="#F5F7FA"/>
      <text x="0" y="115" text-anchor="middle" font-size="14" letter-spacing="3" fill="#F5A623" font-weight="700">CTO</text>
      <text x="0" y="140" text-anchor="middle" font-size="13" fill="#0B2545" font-weight="700">推进系统 · 发动机</text>
    </g>
    <!-- Structures -->
    <g transform="translate(1320 280)">
      <circle cx="0" cy="0" r="60" fill="#3B82F6"/>
      <circle cx="0" cy="-15" r="22" fill="#F5F7FA"/>
      <path d="M -36 30 Q 0 -10 36 30 L 36 60 L -36 60 Z" fill="#F5F7FA"/>
      <text x="0" y="100" text-anchor="middle" font-size="14" letter-spacing="3" fill="#F5A623" font-weight="700">STRUCTURES</text>
      <text x="0" y="125" text-anchor="middle" font-size="13" fill="#0B2545" font-weight="700">结构 · 热防护</text>
    </g>
    <!-- Avionics -->
    <g transform="translate(420 620)">
      <circle cx="0" cy="0" r="60" fill="#0B2545"/>
      <circle cx="0" cy="-15" r="22" fill="#F5F7FA"/>
      <path d="M -36 30 Q 0 -10 36 30 L 36 60 L -36 60 Z" fill="#F5F7FA"/>
      <text x="0" y="100" text-anchor="middle" font-size="14" letter-spacing="3" fill="#F5A623" font-weight="700">AVIONICS</text>
      <text x="0" y="125" text-anchor="middle" font-size="13" fill="#0B2545" font-weight="700">航电 · 飞控 · 遥测</text>
    </g>
    <!-- Test ops -->
    <g transform="translate(800 660)">
      <circle cx="0" cy="0" r="70" fill="#1E3A8A"/>
      <circle cx="0" cy="-18" r="26" fill="#F5F7FA"/>
      <path d="M -42 35 Q 0 -10 42 35 L 42 70 L -42 70 Z" fill="#F5F7FA"/>
      <text x="0" y="115" text-anchor="middle" font-size="14" letter-spacing="3" fill="#F5A623" font-weight="700">TEST OPS</text>
      <text x="0" y="140" text-anchor="middle" font-size="13" fill="#0B2545" font-weight="700">试车台 · 危化品 · 安全</text>
    </g>
    <!-- Manufacturing -->
    <g transform="translate(1180 620)">
      <circle cx="0" cy="0" r="60" fill="#3B82F6"/>
      <circle cx="0" cy="-15" r="22" fill="#F5F7FA"/>
      <path d="M -36 30 Q 0 -10 36 30 L 36 60 L -36 60 Z" fill="#F5F7FA"/>
      <text x="0" y="100" text-anchor="middle" font-size="14" letter-spacing="3" fill="#F5A623" font-weight="700">MFG</text>
      <text x="0" y="125" text-anchor="middle" font-size="13" fill="#0B2545" font-weight="700">制造 · 供应链 · 质量</text>
    </g>
  </g>

  <!-- Connection lines -->
  <g stroke="#F5A623" stroke-width="1.5" fill="none" opacity="0.6" stroke-dasharray="3 4">
    <line x1="340" y1="280" x2="730" y2="200"/>
    <line x1="870" y1="200" x2="1260" y2="280"/>
    <line x1="280" y1="340" x2="420" y2="560"/>
    <line x1="1320" y1="340" x2="1180" y2="560"/>
    <line x1="480" y1="620" x2="730" y2="660"/>
    <line x1="870" y1="660" x2="1120" y2="620"/>
  </g>
</svg>
